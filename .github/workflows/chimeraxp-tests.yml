name: ChimeraXP tests
on:
  push:
  pull_request:
jobs:
  lua-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install isolated Lua runtimes
        run: python3 -m pip install lupa
      - name: Generated plugin matches source
        run: python3 build.py --check
      - name: Lua regression suites (5.1 and 5.4)
        run: |
          python3 tests/run.py
      - name: Manifest and package integrity
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

