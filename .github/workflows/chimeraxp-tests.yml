name: ChimeraXP tests
on:
  push:
    branches: [main, "fix/autoexp-foreign-combat-escape-loop-beta10"]
  pull_request:
jobs:
  lua-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua regression suites
        run: |
          lua5.4 tests/autoexp5_mock.lua
          lua5.4 tests/autoexp_manual_event.lua
          lua5.4 tests/test_dynamic_rooms.lua
          lua5.4 tests/test_emergency_fallback.lua
          lua5.4 tests/test_foreign_combat_and_escape_loops.lua
          lua5.4 tests/test_economy_course.lua
          lua5.4 tests/online_updater_mock.lua
      - name: Manifest and package integrity
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
